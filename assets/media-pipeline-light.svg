<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Serverless media upload pipeline architecture</title>
  <desc id="desc">The browser requests a presigned upload, uploads directly to S3, then an object-created event invokes Lambda validation. State is stored in DynamoDB and approved media is delivered through CloudFront.</desc>
  <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E0E3DA"/></pattern><style>.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7C857A"/></marker></defs>
  <rect width="1200" height="410" rx="24" fill="#F4F3EE"/><rect x="1" y="1" width="1198" height="408" rx="23" fill="none" stroke="#D9DDD3" stroke-width="2"/><rect x="28" y="92" width="1144" height="288" rx="16" fill="url(#grid)" opacity=".68"/>
  <g class="m" fill="#596057" letter-spacing="1.8"><text x="42" y="51" font-size="14">002 / MEDIA PIPELINE</text><text x="1000" y="51" font-size="13">SERVERLESS</text><text x="42" y="75" font-size="11">REQUEST &#8594; DIRECT UPLOAD &#8594; VALIDATE &#8594; APPROVE / REJECT</text></g>
  <g fill="none" stroke="#7C857A" stroke-width="1.6" marker-end="url(#arrow)"><path d="M202 187H290"/><path d="M450 187H544"/><path d="M704 187H798"/><path d="M958 187H1044"/><path d="M122 238V270H624V238"/><path d="M838 238V270H724V325H704"/><path d="M918 238V292"/><path d="M1101 228V306"/></g>
  <g class="m" font-size="9" fill="#6C746A" letter-spacing="1.05"><text x="217" y="176">REQUEST URL</text><text x="480" y="176">SIGNED POLICY</text><text x="722" y="176">OBJECT CREATED</text><text x="976" y="176">APPROVED</text><text x="242" y="260">FILE BYPASSES API</text><text x="748" y="260">STATE</text><text x="930" y="277">REJECT</text></g>
  <g class="m" text-anchor="middle">
    <g transform="translate(70 136)"><rect width="132" height="102" rx="16" fill="#E9EAE3" stroke="#CBD0C5"/><rect x="7" y="7" width="118" height="88" rx="11" fill="#FAF9F5" stroke="#D9DDD3"/><text x="66" y="40" font-size="12" fill="#1E221D">BROWSER</text><text x="66" y="62" font-size="9" fill="#697167">REACT CLIENT</text><text x="66" y="79" font-size="9" fill="#668C18">COGNITO AUTH</text></g>
    <g transform="translate(290 146)"><rect width="160" height="82" rx="15" fill="#E9EAE3" stroke="#CBD0C5"/><rect x="7" y="7" width="146" height="68" rx="10" fill="#FAF9F5" stroke="#D9DDD3"/><text x="80" y="37" font-size="11" fill="#1E221D">API GATEWAY</text><text x="80" y="57" font-size="9" fill="#697167">UPLOAD INTENT</text></g>
    <g transform="translate(544 136)"><rect width="160" height="102" rx="16" fill="#E4EDCF" stroke="#93A968"/><rect x="7" y="7" width="146" height="88" rx="11" fill="#F7FAF0" stroke="#BAC9A0"/><text x="80" y="40" font-size="12" fill="#30420C">S3</text><text x="80" y="62" font-size="9" fill="#5B6F2F">QUARANTINE OBJECT</text><text x="80" y="79" font-size="9" fill="#5B6F2F">DIRECT TRANSFER</text></g>
    <g transform="translate(798 136)"><rect width="160" height="102" rx="16" fill="#E9EAE3" stroke="#CBD0C5"/><rect x="7" y="7" width="146" height="88" rx="11" fill="#FAF9F5" stroke="#D9DDD3"/><text x="80" y="40" font-size="12" fill="#1E221D">LAMBDA</text><text x="80" y="62" font-size="9" fill="#697167">BINARY VALIDATION</text><text x="80" y="79" font-size="9" fill="#697167">APPROVE / REJECT</text></g>
    <g transform="translate(1044 146)"><rect width="114" height="82" rx="15" fill="#E9EAE3" stroke="#CBD0C5"/><rect x="7" y="7" width="100" height="68" rx="10" fill="#FAF9F5" stroke="#D9DDD3"/><text x="57" y="37" font-size="10" fill="#1E221D">CLOUDFRONT</text><text x="57" y="57" font-size="9" fill="#697167">DELIVERY</text></g>
    <g transform="translate(544 292)"><rect width="160" height="66" rx="14" fill="#E9EAE3" stroke="#CBD0C5"/><rect x="7" y="7" width="146" height="52" rx="9" fill="#FAF9F5" stroke="#D9DDD3"/><text x="80" y="30" font-size="11" fill="#1E221D">DYNAMODB</text><text x="80" y="47" font-size="9" fill="#697167">UPLOAD STATUS</text></g>
    <g transform="translate(798 292)"><rect width="160" height="66" rx="14" fill="#E9EAE3" stroke="#CBD0C5"/><rect x="7" y="7" width="146" height="52" rx="9" fill="#FAF9F5" stroke="#D9DDD3"/><text x="80" y="30" font-size="11" fill="#1E221D">REJECTED</text><text x="80" y="47" font-size="9" fill="#697167">STATE / CLEANUP</text></g>
    <g transform="translate(1072 306)"><rect width="86" height="50" rx="13" fill="#E4EDCF" stroke="#93A968"/><text x="43" y="30" font-size="10" fill="#30420C">DELIVER</text></g>
  </g>
  <g class="m" font-size="10" fill="#747B71" letter-spacing="1.2"><text x="42" y="374">TERRAFORM / AWS</text><text x="934" y="374">CI / TEST / COVERAGE</text></g>
</svg>
