<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Serverless media upload pipeline architecture</title>
  <desc id="desc">The browser requests a presigned upload, uploads directly to S3, then an object-created event invokes Lambda validation. State is stored in DynamoDB and approved media is delivered through CloudFront.</desc>
  <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#202923"/></pattern><style>.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647068"/></marker></defs>
  <rect width="1200" height="410" rx="24" fill="#0B0E0C"/><rect x="1" y="1" width="1198" height="408" rx="23" fill="none" stroke="#273028" stroke-width="2"/><rect x="28" y="92" width="1144" height="288" rx="16" fill="url(#grid)" opacity=".72"/>
  <g class="m" fill="#97A096" letter-spacing="1.8"><text x="42" y="51" font-size="14">002 / MEDIA PIPELINE</text><text x="1000" y="51" font-size="13">SERVERLESS</text><text x="42" y="75" font-size="11">REQUEST &#8594; DIRECT UPLOAD &#8594; VALIDATE &#8594; APPROVE / REJECT</text></g>
  <g fill="none" stroke="#647068" stroke-width="1.6" marker-end="url(#arrow)"><path d="M202 187H290"/><path d="M450 187H544"/><path d="M704 187H798"/><path d="M958 187H1044"/><path d="M122 238V270H624V238"/><path d="M838 238V270H724V325H704"/><path d="M918 238V292"/><path d="M1101 228V306"/></g>
  <g class="m" font-size="9" fill="#7E897F" letter-spacing="1.05"><text x="217" y="176">REQUEST URL</text><text x="480" y="176">SIGNED POLICY</text><text x="722" y="176">OBJECT CREATED</text><text x="976" y="176">APPROVED</text><text x="242" y="260">FILE BYPASSES API</text><text x="748" y="260">STATE</text><text x="930" y="277">REJECT</text></g>
  <g class="m" text-anchor="middle">
    <g transform="translate(70 136)"><rect width="132" height="102" rx="16" fill="#121713" stroke="#2B352D"/><rect x="7" y="7" width="118" height="88" rx="11" fill="#0E120F" stroke="#202923"/><text x="66" y="40" font-size="12" fill="#E2E7DF">BROWSER</text><text x="66" y="62" font-size="9" fill="#8C968D">REACT CLIENT</text><text x="66" y="79" font-size="9" fill="#B6F36A">COGNITO AUTH</text></g>
    <g transform="translate(290 146)"><rect width="160" height="82" rx="15" fill="#121713" stroke="#2B352D"/><rect x="7" y="7" width="146" height="68" rx="10" fill="#0E120F" stroke="#202923"/><text x="80" y="37" font-size="11" fill="#E2E7DF">API GATEWAY</text><text x="80" y="57" font-size="9" fill="#8C968D">UPLOAD INTENT</text></g>
    <g transform="translate(544 136)"><rect width="160" height="102" rx="16" fill="#182112" stroke="#6C9139"/><rect x="7" y="7" width="146" height="88" rx="11" fill="#10160D" stroke="#486325"/><text x="80" y="40" font-size="12" fill="#D5F7A9">S3</text><text x="80" y="62" font-size="9" fill="#9FC36C">QUARANTINE OBJECT</text><text x="80" y="79" font-size="9" fill="#9FC36C">DIRECT TRANSFER</text></g>
    <g transform="translate(798 136)"><rect width="160" height="102" rx="16" fill="#121713" stroke="#2B352D"/><rect x="7" y="7" width="146" height="88" rx="11" fill="#0E120F" stroke="#202923"/><text x="80" y="40" font-size="12" fill="#E2E7DF">LAMBDA</text><text x="80" y="62" font-size="9" fill="#8C968D">BINARY VALIDATION</text><text x="80" y="79" font-size="9" fill="#8C968D">APPROVE / REJECT</text></g>
    <g transform="translate(1044 146)"><rect width="114" height="82" rx="15" fill="#121713" stroke="#2B352D"/><rect x="7" y="7" width="100" height="68" rx="10" fill="#0E120F" stroke="#202923"/><text x="57" y="37" font-size="10" fill="#E2E7DF">CLOUDFRONT</text><text x="57" y="57" font-size="9" fill="#8C968D">DELIVERY</text></g>
    <g transform="translate(544 292)"><rect width="160" height="66" rx="14" fill="#121713" stroke="#2B352D"/><rect x="7" y="7" width="146" height="52" rx="9" fill="#0E120F" stroke="#202923"/><text x="80" y="30" font-size="11" fill="#E2E7DF">DYNAMODB</text><text x="80" y="47" font-size="9" fill="#8C968D">UPLOAD STATUS</text></g>
    <g transform="translate(798 292)"><rect width="160" height="66" rx="14" fill="#121713" stroke="#2B352D"/><rect x="7" y="7" width="146" height="52" rx="9" fill="#0E120F" stroke="#202923"/><text x="80" y="30" font-size="11" fill="#E2E7DF">REJECTED</text><text x="80" y="47" font-size="9" fill="#8C968D">STATE / CLEANUP</text></g>
    <g transform="translate(1072 306)"><rect width="86" height="50" rx="13" fill="#182112" stroke="#6C9139"/><text x="43" y="30" font-size="10" fill="#D5F7A9">DELIVER</text></g>
  </g>
  <g class="m" font-size="10" fill="#7E897F" letter-spacing="1.2"><text x="42" y="374">TERRAFORM / AWS</text><text x="934" y="374">CI / TEST / COVERAGE</text></g>
</svg>
