<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Serverless Media Upload Pipeline architecture</title><desc id="desc">A React client requests upload and status through API Gateway and Lambda while file bytes upload directly to S3, trigger binary validation, and return a presigned preview URL.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#98A092"/></marker><style>.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}.s{font-family:ui-sans-serif,"Segoe UI",sans-serif}.flow{stroke:#98A092;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.node{fill:#FAF9F5;stroke:#C9CEC4;stroke-width:1.5}.cap{font-size:18px;letter-spacing:1.2px;fill:#687067}.name{font-size:20px;font-weight:700;fill:#171B16}.detail{font-size:18px;fill:#687067}</style></defs>
  <rect width="1200" height="760" rx="28" fill="#F4F3EE"/><rect x="1" y="1" width="1198" height="758" rx="27" fill="none" stroke="#D5DAD0" stroke-width="2"/>
  <path d="M32 88H1168M32 620H1168" stroke="#D5DAD0"/>
  <g class="m" font-size="21" letter-spacing="1.7"><text x="48" y="57" fill="#171B16">02 / SERVERLESS MEDIA PIPELINE</text><text x="1022" y="57" fill="#668C18">AWS</text></g>
  <text class="s" x="48" y="125" font-size="20" fill="#596057">Zero-trust uploads: the application coordinates the transfer, but never handles file bytes.</text>
  <g class="m">
    <text class="cap" x="48" y="179">CONTROL + STATUS PATH</text>
    <path class="flow" d="M268 248H334M568 248H632M950 248H988"/>
    <g transform="translate(48 199)"><rect class="node" width="220" height="106" rx="17"/><text class="cap" x="20" y="31">CLIENT</text><text class="name" x="20" y="65">REACT + VITE</text><text class="detail" x="20" y="91">poll upload status</text></g>
    <g transform="translate(334 199)"><rect class="node" width="234" height="106" rx="17"/><text class="cap" x="20" y="31">AUTHENTICATED API</text><text class="name" x="20" y="65">API GATEWAY</text><text class="detail" x="20" y="91">Cognito JWT</text></g>
    <g transform="translate(632 199)"><rect width="318" height="106" rx="17" fill="#EAF3D9" stroke="#8DA94D" stroke-width="1.5"/><text class="cap" x="20" y="31" fill="#587119">CONTROL LAMBDAS</text><text class="name" x="20" y="65">UPLOAD URL + STATUS</text><text class="detail" x="20" y="91">presigned POST / GET</text></g>
    <g transform="translate(988 199)"><rect class="node" width="164" height="106" rx="17"/><text class="cap" x="18" y="31">STATE</text><text class="name" x="18" y="65">DYNAMODB</text><text class="detail" x="18" y="91">metadata</text></g>
    <text class="cap" x="48" y="359">DIRECT FILE PATH</text>
    <path class="flow" d="M268 426H350M578 426H650M918 426H974"/>
    <g transform="translate(48 378)"><rect class="node" width="220" height="106" rx="17"/><text class="cap" x="20" y="31">BROWSER</text><text class="name" x="20" y="65">DIRECT UPLOAD</text><text class="detail" x="20" y="91">presigned POST</text></g>
    <g transform="translate(350 378)"><rect class="node" width="228" height="106" rx="17"/><text class="cap" x="20" y="31">PRIVATE BUCKET</text><text class="name" x="20" y="65">S3 / INCOMING</text><text class="detail" x="20" y="91">ObjectCreated event</text></g>
    <g transform="translate(650 378)"><rect width="268" height="106" rx="17" fill="#EAF3D9" stroke="#8DA94D" stroke-width="1.5"/><text class="cap" x="20" y="31" fill="#587119">VALIDATION LAMBDA</text><text class="name" x="20" y="65">IMAGE VALIDATOR</text><text class="detail" x="20" y="91">binary content checks</text></g>
    <g transform="translate(974 378)"><rect class="node" width="178" height="106" rx="17"/><text class="cap" x="18" y="31">RESULT</text><text class="name" x="18" y="65">APPROVED /</text><text class="name" x="18" y="89">REJECTED</text></g>
    <path class="flow" d="M784 378V336H1068V305"/>
    <path class="flow" d="M784 484V516"/>
    <g transform="translate(650 516)"><rect class="node" width="268" height="66" rx="15"/><text class="cap" x="20" y="27">FAILURE DESTINATION</text><text class="name" x="20" y="53">SQS DLQ</text></g>
    <text class="detail" x="48" y="538">Frontend hosting: private S3 + CloudFront OAC</text>
  </g>
  <g class="s"><text x="48" y="671" font-size="27" font-weight="760" fill="#171B16">THE API STAYS OUT OF THE FILE TRANSFER.</text><text x="48" y="708" font-size="19" fill="#687067">PRESIGNED POST / BINARY VALIDATION / PRESIGNED GET PREVIEW</text></g>
  <g class="m" transform="translate(970 654)"><rect width="182" height="56" rx="13" fill="#171B16"/><text x="91" y="35" text-anchor="middle" font-size="18" letter-spacing="1.2" fill="#F4F3EE">VIEW SOURCE &#8599;</text></g>
  <g class="m" font-size="18" letter-spacing="1.1" fill="#687067"><text x="48" y="594">TERRAFORM</text><text x="190" y="594">GITHUB ACTIONS</text><text x="405" y="594">27 PYTEST TESTS</text><text x="611" y="594">70% COVERAGE FLOOR</text></g>
</svg>
